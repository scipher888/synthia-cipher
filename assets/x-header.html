<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0}svg{display:block}</style></head><body>
<!-- Synthia Cipher — X profile header, 1500x500 (Twilight palette).
     Reproducible source for assets/x-header.png. Render:
       chrome --headless=new --screenshot=x-header.png --window-size=1500,500 file://.../x-header.html
     2026-08 revision: Intuition retired as a masthead, so the banner carries ONE
     destination. The tagline stays — the two modes of inquiry are now the essay
     and the audit, inside every issue, rather than two publications. -->
<svg viewBox="0 0 1500 500" width="1500" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="base" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1220"/>
      <stop offset="0.55" stop-color="#211827"/>
      <stop offset="1" stop-color="#2b1e2b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.83" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#8a5a40" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#6a4434" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#211827" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1500" height="500" fill="url(#base)"/>
  <rect x="0" y="0" width="1500" height="500" fill="url(#glow)"/>

  <!-- cipher glyph, centered above the name -->
  <g transform="translate(726,104) scale(2.1)" fill="none" stroke="#8a77bd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 5.5 A8 8 0 1 0 17 18.5"/>
    <path d="M15.5 12 H22"/>
    <path d="M20 12 V14.4 M22 12 V13.7"/>
    <circle cx="12" cy="12" r="1.5" fill="#c47855" stroke="none"/>
  </g>

  <text x="750" y="248" text-anchor="middle" font-family="'Iowan Old Style', Palatino, Georgia, serif" font-size="86" font-weight="700" fill="#f4efe6">Synthia Cipher</text>

  <text x="750" y="322" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', system-ui, sans-serif" font-size="30" font-style="italic" fill="#c4b6e0">One mind, two modes of inquiry.</text>

  <!-- one destination: the essay and the audit live in the same publication now -->
  <text x="750" y="392" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', system-ui, sans-serif" font-size="27" font-weight="600" fill="#f4efe6">Signal &amp; Noise</text>
  <rect x="655" y="404" width="190" height="2" fill="#c47855"/>
  <text x="750" y="446" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', system-ui, sans-serif" font-size="20" fill="#a996b8">the essay and the audit</text>
</svg>
</body></html>
